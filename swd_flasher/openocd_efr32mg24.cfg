# OpenOCD config for EFR32MG24 (Series 2, group 23)
# Usage: openocd -f interface/cmsis-dap.cfg -f openocd_efr32mg24.cfg
#
# Note: OpenOCD 0.12.0 does not ship the efm32s2 flash driver in its
# binary, so we inline the target setup and DCI procedures here and
# use load_image (raw AHB-AP writes) instead of the flash subsystem.

transport select swd

source [find target/swj-dp.tcl]

set _CHIPNAME efr32mg24
set _CPUTAPID 0x2ba01477

swj_newdap $_CHIPNAME cpu -irlen 4 -ircapture 0x1 -irmask 0xf -expected-id $_CPUTAPID
dap create $_CHIPNAME.dap -chain-position $_CHIPNAME.cpu

adapter speed 1000

set _TARGETNAME $_CHIPNAME.cpu
target create $_TARGETNAME cortex_m -dap $_CHIPNAME.dap

$_TARGETNAME configure -work-area-phys 0x20000000 -work-area-size 0x10000 -work-area-backup 0

if {![using_hla]} {
   cortex_m reset_config sysresetreq
   $_TARGETNAME configure -event examine-fail efm32s2_dci_read_se_status
}

# ---------------------------------------------------------------------------
# DCI procedures (from efm32s2.cfg — pure Tcl, no flash driver needed)
# ---------------------------------------------------------------------------

proc efm32s2_dci_connect {} {
   set target [target current]
   set dap [$target cget -dap]
   set dp_id [$dap dpreg 0]
   if {$dp_id != 0x6BA02477} {
      echo "Error: invalid DP IDCODE 0x[format %08X $dp_id] (expected 0x6BA02477)"
      return -code error "invalid IDCODE"
   }
   poll off
   $dap dpreg 0 0x1E
   $dap dpreg 0x04 0x50000000
   $dap dpreg 0x08 0x01000000
   $dap apreg 1 0x00 0x22000002
   $dap apreg 1 0x04 0x10FC
   $dap dpreg 0x0C
   set DCIID [$dap apreg 1 0x0C]
   if {$DCIID != 0xdc11d} {
      echo "Warning: DCIID mismatch (got 0x[format %05X $DCIID])"
   } else {
      echo "DCI: Connected"
   }
}

proc efm32s2_dci_read_status {} {
   set target [target current]
   set dap [$target cget -dap]
   $dap apreg 1 0x04 0x1008
   set dcistatus [$dap apreg 1 0x0C]
   set dcistatus [$dap dpreg 0x0C]
   return $dcistatus
}

proc efm32s2_dci_write_cmd { dci_write_word } {
   set target [target current]
   set dap [$target cget -dap]
   for {set i 0} {1} {incr i} {
      if {$i >= 100} {
         echo "DCI: Write timeout"
         return -code error "DCI write timeout"
      }
      set dcistatus [efm32s2_dci_read_status]
      if {$dcistatus & 1} {
         sleep 10
         continue
      }
      if {$dcistatus & 0x100} {
         # Drain stale response data
         echo "DCI: Draining stale RDATAVALID"
         $dap apreg 1 0x04 0x1004
         $dap apreg 1 0x0C
         $dap dpreg 0x0C
         continue
      }
      $dap apreg 1 0x04 0x1000
      $dap apreg 1 0x0C $dci_write_word
      return
   }
}

proc efm32s2_dci_read_response {} {
   set target [target current]
   set dap [$target cget -dap]
   for {set i 0} {1} {incr i} {
      if {$i >= 100} {
         echo "DCI: Read timeout"
         return -code error "DCI read timeout"
      }
      set dcistatus [efm32s2_dci_read_status]
      if {$dcistatus & 0x100} {
         $dap apreg 1 0x04 0x1004
         set dciread [$dap apreg 1 0x0C]
         set dciread [$dap dpreg 0x0C]
         return $dciread
      } else {
         sleep 10
         continue
      }
   }
}

proc efm32s2_dci_device_erase {} {
   efm32s2_dci_connect
   efm32s2_dci_write_cmd 8
   efm32s2_dci_write_cmd 0x430F0000
   # Poll for erase response (can take 10+ seconds on locked devices)
   for {set i 0} {$i < 60} {incr i} {
      sleep 1000
      set dcistatus [efm32s2_dci_read_status]
      if {$dcistatus & 0x100} {
         break
      }
      echo "DCI: Waiting for erase... ($i s)"
   }
   set response [efm32s2_dci_read_response]
   if {$response & 0xFFFF0000} {
      echo "DCI: Device erase FAILED (response=0x[format %08X $response])"
      return -code error "device erase failed"
   }
   echo "DCI: Device erase complete (response=0x[format %08X $response])"
}

# ---------------------------------------------------------------------------
# MSC flash programming (since efm32s2 flash driver is not in OpenOCD 0.12.0)
# ---------------------------------------------------------------------------

# MSC register addresses (Secure base) — from efr32mg24_msc.h struct layout
# After reset, Cortex-M33 is in Secure mode; debugger AHB-AP uses Secure bus.
set MSC_BASE      0x40030000
set MSC_WRITECTRL     [expr {$MSC_BASE + 0x0C}]
set MSC_WRITECTRL_SET [expr {$MSC_BASE + 0x0C + 0x1000}]
set MSC_WRITECTRL_CLR [expr {$MSC_BASE + 0x0C + 0x2000}]
set MSC_WRITECMD  [expr {$MSC_BASE + 0x10}]
set MSC_ADDRB     [expr {$MSC_BASE + 0x14}]
set MSC_WDATA     [expr {$MSC_BASE + 0x18}]
set MSC_STATUS    [expr {$MSC_BASE + 0x1C}]
set MSC_LOCK      [expr {$MSC_BASE + 0x34}]

# CMU clock enable (Secure base)
set CMU_CLKEN1_SET 0x40009068

proc efr32_msc_init {} {
   # Enable MSC bus clock
   mww $::CMU_CLKEN1_SET 0x00010000
   # Unlock MSC
   mww $::MSC_LOCK 0x1B71
   # Enable write/erase (using SET register for atomic set)
   mww $::MSC_WRITECTRL_SET 0x01
   echo "MSC: Initialized"
}

# Read a single 32-bit word from target memory
proc memread32 {addr} {
   return [lindex [read_memory $addr 32 1] 0]
}

proc efr32_msc_wait {} {
   for {set i 0} {$i < 2000} {incr i} {
      set status [memread32 $::MSC_STATUS]
      # Wait for both BUSY (bit 0) and PENDING (bit 4) to clear
      if {!($status & 0x11)} {
         if {$status & 0x06} {
            echo "MSC: Error status=0x[format %08X $status]"
            return -code error "MSC error"
         }
         return
      }
      sleep 1
   }
   return -code error "MSC busy timeout"
}

proc efr32_erase_page {addr} {
   mww $::MSC_ADDRB $addr
   mww $::MSC_WRITECMD 0x02  ;# ERASEPAGE
   efr32_msc_wait
}

proc efr32_erase_range {start_addr size} {
   set page_size 0x2000
   set page_start [expr {$start_addr & ~($page_size - 1)}]
   set end_addr [expr {$start_addr + $size}]
   for {set addr $page_start} {$addr < $end_addr} {set addr [expr {$addr + $page_size}]} {
      efr32_erase_page $addr
   }
}

# Write a block of words from RAM to flash via MSC.
# MG24: write ADDRB, stream words to WDATA (auto-increments), then WRITEEND.
proc efr32_write_block {flash_addr ram_addr word_count} {
   set words [read_memory $ram_addr 32 $word_count]

   mww $::MSC_ADDRB $flash_addr

   foreach data $words {
      mww $::MSC_WDATA $data
   }

   mww $::MSC_WRITECMD 0x04  ;# WRITEEND
   efr32_msc_wait
}

# Program a binary file to flash at given address.
# Loads chunks into RAM via load_image, then writes to flash via MSC.
proc efr32_program {filename addr} {
   set filesize [file size $filename]
   set word_count [expr {($filesize + 3) / 4}]
   echo "Programming $filesize bytes ($word_count words) at 0x[format %08X $addr]..."

   # Erase required pages
   efr32_erase_range $addr $filesize

   # Process in 32KB chunks loaded into RAM at ram_buf
   set ram_buf 0x20010000
   set chunk_size 0x8000
   set offset 0

   while {$offset < $filesize} {
      set remaining [expr {$filesize - $offset}]
      if {$remaining > $chunk_size} { set remaining $chunk_size }

      # Load chunk into RAM: file pos [offset..offset+remaining) → ram_buf
      # For bin files, byte at file pos P loads to (base + P).
      # Set base = ram_buf - offset so file pos offset → ram_buf.
      # min_addr = ram_buf filters out earlier file positions.
      # max_len = offset + remaining ensures we read far enough.
      set base [expr {$ram_buf - $offset}]
      set max_len [expr {$offset + $remaining}]
      load_image $filename $base bin $ram_buf $max_len

      # Write from RAM to flash in page-sized blocks
      set words [expr {($remaining + 3) / 4}]
      set page_words [expr {0x2000 / 4}]
      set i 0
      while {$i < $words} {
         set block_words [expr {$words - $i}]
         if {$block_words > $page_words} { set block_words $page_words }
         set flash_addr [expr {$addr + $offset + ($i * 4)}]
         set ram_addr [expr {$ram_buf + ($i * 4)}]
         efr32_write_block $flash_addr $ram_addr $block_words
         set i [expr {$i + $block_words}]
      }

      set offset [expr {$offset + $remaining}]
      echo "  [expr {$offset * 100 / $filesize}]%"
   }

   echo "Done"
}

proc efm32s2_dci_read_se_status {} {
   efm32s2_dci_connect
   efm32s2_dci_write_cmd 8
   efm32s2_dci_write_cmd 0xFE010000
   set recvlen [efm32s2_dci_read_response]
   if {$recvlen & 0xFFFF0000} {
      echo "SE status: command failed (response=0x[format %08X $recvlen])"
      return
   }
   set debuglock_idx 3
   if {$recvlen == 0x28} { set debuglock_idx 7 }
   set recvlen [expr {$recvlen - 4}]
   for {set i 0} {1} {incr i} {
      if {$recvlen <= 0} { break }
      set recvlen [expr {$recvlen - 4}]
      set sestatusarray($i) [efm32s2_dci_read_response]
   }
   set debuglock $sestatusarray($debuglock_idx)
   if {$debuglock & 0x20} {
      echo "Debug lock: ENABLED — run efm32s2_dci_device_erase to unlock"
   } else {
      echo "Debug lock: disabled"
   }
}
